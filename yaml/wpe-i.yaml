#########################################
#                                       #
#   ESPHome                             #
#                                       #
#########################################
# Stiebel Eltron WPE-I ... H(K) (brine/water, no integrated DHW).
# Panel-verified on a WPE-I 08 HK 230 Premium. Shares the WPL13 property
# set except: no Warmwasser energy counters, adds runtime counters, and
# 0x02e2 is WP_WASSERVOLUMENSTROM (as on WPL17), NOT the WPL13 status
# word. The status binaries come from the WPE-I's own status word 0x4eda.
esphome:
  build_flags:
    - "-DWPE_I"
  on_boot:
    - priority: -50
      then:
        - lambda: |-
            // Wärmepumpen-Status word 0x4eda, panel-verified bits: 1 = Heizkreispumpe 1,
            // 2 = Heizkreispumpe 2, 4 = Quellenpumpe, 13 = Kühlbetrieb. Passive cooling
            // is the source pump running in cooling mode; in the heating season bit 4
            // runs with the compressor. Standby (0x8000) has none of these bits set.
            // The raw word stays exposed for the unidentified bits 14 and 15.
            CallbackHandler::instance().addCallback(std::make_pair(CanNode::Kessel,Property::kWAERMEPUMPEN_STATUS),[](const SimpleVariant& value){
              const auto word{static_cast<std::uint16_t>(value)};
              const std::bitset<16U> status_bits{word};
              id(WP_STATUS_RAW).publish_state(word);
              id(HEIZKREISPUMPE_1).publish_state(status_bits.test(1U));
              id(HEIZKREISPUMPE_2).publish_state(status_bits.test(2U));
              id(QUELLENPUMPE).publish_state(status_bits.test(4U));
              id(KUEHLBETRIEB).publish_state(status_bits.test(13U));
              id(PASSIVKUEHLUNG_AKTIV).publish_state(status_bits.test(4U) && status_bits.test(13U));
            });
            // Anlagen-Status word 0x4ecd is broadcast by the pump towards the
            // room unit and arrives carrying HK2's sender id. It holds a single bit
            // that follows the time program (bit 0 at night, bit 1 by day), not the
            // pumps, so it is only exposed raw.
            CallbackHandler::instance().addCallback(std::make_pair(CanNode::HK2,Property::kBETRIEBS_STATUS),[](const SimpleVariant& value){
              id(ANLAGE_STATUS_RAW).publish_state(static_cast<std::uint16_t>(value));
            });
    - priority: -100
      then:
        - lambda: |-
            queueRequest(CanNode::Kessel, Property::kWAERMEPUMPEN_STATUS);

#########################################
#                                       #
#   Status raw words (diagnostic)       #
#                                       #
#########################################
sensor:
  - platform: template
    name: WP_STATUS_RAW
    id: WP_STATUS_RAW
    icon: "mdi:numeric"
    accuracy_decimals: 0
    # the WPM does not broadcast this word on its own, so it has to be polled
    update_interval: $interval_medium
    lambda: |-
        queueRequest(CanNode::Kessel, Property::kWAERMEPUMPEN_STATUS);
        return {};
  - platform: template
    name: ANLAGE_STATUS_RAW
    id: ANLAGE_STATUS_RAW
    icon: "mdi:numeric"
    accuracy_decimals: 0
    update_interval: never

  # The WPM answers a setting that is switched off with a marker word instead
  # of a value (0x9000 shows as "AUS" on the panel, 0x8000 while a value is not
  # available), which decodes to an impossible temperature. Clamping to the
  # valid range with ignore_out_of_range drops those readings, so the entity
  # stays unavailable instead of publishing e.g. -2867.2 °C.
  - id: !extend MINTEMP
    filters:
      - clamp: { min_value: -60.0, max_value: 100.0, ignore_out_of_range: true }
  - id: !extend MAXTEMP
    filters:
      - clamp: { min_value: -60.0, max_value: 100.0, ignore_out_of_range: true }
  # Operational values from the shared base use the template default
  # update_interval (never) and are only read at boot. On the WPE-I no other bus
  # participant requests them, so they would stay at their boot value while the
  # compressor runs. Poll them here instead.
  - id: !extend ISTDREHZAHL_VERDICHTER
    update_interval: $interval_medium
  - id: !extend SOLLDREHZAHL_VERDICHTER
    update_interval: $interval_medium
  - id: !extend STROM_INVERTER
    update_interval: $interval_medium
  - id: !extend LEISTUNG_QUELLENPUMPE
    update_interval: $interval_medium
  - id: !extend VOLUMENSTROM
    update_interval: $interval_medium
  - id: !extend QUELLENDRUCK
    update_interval: $interval_slow
  - id: !extend DRUCK_NIEDERDRUCK
    update_interval: $interval_slow
  - id: !extend DRUCK_HOCHDRUCK
    update_interval: $interval_slow
  - id: !extend HEIZEN_EFFIZIENZ_TAG
    update_interval: $interval_very_slow
  - id: !extend HEIZEN_EFFIZIENZ_JAHR
    update_interval: $interval_once_in_a_while
  - id: !extend REGELABWEICHUNG
    filters:
      - clamp: { min_value: -50.0, max_value: 50.0, ignore_out_of_range: true }

#########################################
#                                       #
#   Global variables                    #
#                                       #
#########################################
globals:
  - id: heat_pump_variant
    type: std::string
    initial_value: '"WPE-I"'

#########################################
#                                       #
#   Packages                            #
#                                       #
#########################################

packages:
  WXX_BASE:                             !include { file: wxx_base.yaml }

  # 0x02e2 fluctuates with the circulation flow (raw 280/285 = 28.0/28.5 l/min,
  # consistent with VOLUMENSTROM 0x4f47) — same meaning as on the WPL17
  WP_WASSERVOLUMENSTROM:                !include { file: templates/wp_generic.yaml, vars: { property: "WP_WASSERVOLUMENSTROM", unit: "l/min", icon: "mdi:water", accuracy_decimals: "1", update_interval: $interval_medium, target: "Heizmodul" }}

  # runtime counters (panel: Info -> Wärmepumpe -> Laufzeit)
  LAUFZEIT_VD_HEIZEN:                   !include { file: templates/wp_generic.yaml, vars: { property: "LAUFZEIT_VD_HEIZEN", unit: "h", update_interval: $interval_once_in_a_while, target: "Heizmodul" }}
  LAUFZEIT_NHZ1:                        !include { file: templates/wp_generic.yaml, vars: { property: "LAUFZEIT_NHZ1", unit: "h", update_interval: $interval_once_in_a_while, target: "Heizmodul" }}
  LAUFZEIT_NHZ2:                        !include { file: templates/wp_generic.yaml, vars: { property: "LAUFZEIT_NHZ2", unit: "h", update_interval: $interval_once_in_a_while, target: "Heizmodul" }}
  LAUFZEIT_NHZ1_2:                      !include { file: templates/wp_generic.yaml, vars: { property: "LAUFZEIT_NHZ1_2", unit: "h", update_interval: $interval_once_in_a_while, target: "Heizmodul" }}

  # status binaries decoded from the WPE-I's own status word (panel-verified bits only)
  HEIZKREISPUMPE_1:                     !include { file: templates/wp_binary.yaml, vars: { name: "HEIZKREISPUMPE_1" }}
  HEIZKREISPUMPE_2:                     !include { file: templates/wp_binary.yaml, vars: { name: "HEIZKREISPUMPE_2" }}
  QUELLENPUMPE:                         !include { file: templates/wp_binary.yaml, vars: { name: "QUELLENPUMPE" }}
  KUEHLBETRIEB:                         !include { file: templates/wp_binary.yaml, vars: { name: "KUEHLBETRIEB" }}
  PASSIVKUEHLUNG_AKTIV:                 !include { file: templates/wp_binary.yaml, vars: { name: "PASSIVKUEHLUNG_AKTIV" }}

  # further panel-verified values
  REGELABWEICHUNG:                      !include { file: templates/wp_generic.yaml, vars: { property: "REGELABWEICHUNG", unit: "K", accuracy_decimals: "1", update_interval: $interval_medium, target: "Heizmodul" }}
  WAERMEERTRAG_2WE_HEIZ_SUMME_MWH:      !include { file: templates/wp_generic_combined.yaml, vars: { sensor_name: "WAERMEERTRAG_2WE_HEIZ_SUMME_MWH" , scaled_property: "WAERMEERTRAG_2WE_HEIZ_SUM_KWH" , property: "WAERMEERTRAG_2WE_HEIZ_SUM_MWH" , unit: "MWh", accuracy_decimals: "3", icon: "mdi:fire" , target: "Heizmodul", state_class: "total_increasing" }}
