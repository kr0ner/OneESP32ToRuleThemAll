#########################################
#                                       #
#   ESPHome                             #
#                                       #
#########################################
esphome:
  build_flags:
    - "-DTHZ_5_5_ECO"

#########################################
#                                       #
#   Global variables                    #
#                                       #
#########################################
globals:
  - id: heat_pump_variant
    type: std::string
    initial_value: '"THZ55ECO"'

#########################################
#                                       #
#   Packages                            #
#                                       #
#########################################
packages:
  THZ_BASE:      !include { file: thz_base.yaml }

  ZEITSPERRE_NE: !include { file: templates/wp_number.yaml , vars: { property: "ZEITSPERRE_NE" , icon: "mdi:valve" , min: "0", max: "360", step: "5.0" }}
  LUEFT_ZEIT_AUSSERPLAN_STUFE1: !include { file: templates/wp_number.yaml, vars: { property: "LUEFT_ZEIT_AUSSERPLAN_STUFE1",   icon: "mdi:fan-clock", min: "0", max: "1000",  step: "5"   }}
  LUEFT_ZEIT_AUSSERPLAN_STUFE2: !include { file: templates/wp_number.yaml, vars: { property: "LUEFT_ZEIT_AUSSERPLAN_STUFE2",   icon: "mdi:fan-clock", min: "0", max: "1000",  step: "5"   }}
  LUEFT_ZEIT_AUSSERPLAN_STUFE3: !include { file: templates/wp_number.yaml, vars: { property: "LUEFT_ZEIT_AUSSERPLAN_STUFE3",   icon: "mdi:fan-clock", min: "0", max: "1000",  step: "5"   }}
  LUEFT_STUFE_AUSSERPLAN: !include { file: templates/wp_number.yaml, vars: { property: "LUEFT_STUFE_AUSSERPLAN", icon: "mdi:fan-chevron-up", min: "1", max: "3", step: "1" }}

  PROPORTIONALANTEIL_INV:  !include { file: templates/wp_generic.yaml    , vars: { property: "PROPORTIONALANTEIL_INV" , update_interval: $interval_very_slow, unit: "%/K", accuracy_decimals: "1", icon: "mdi:tune-variant" }}
  INTEGRALANTEIL_INV:      !include { file: templates/wp_generic.yaml    , vars: { property: "INTEGRALANTEIL_INV"     , update_interval: $interval_very_slow, icon: "mdi:tune-variant" }}
  EL_NACHERW_ANZ_STUFEN:   !include { file: templates/wp_generic.yaml    , vars: { property: "EL_NACHERW_ANZ_STUFEN"  , update_interval: $interval_very_slow, icon: "mdi:heating-coil" }}
  EL_NACHERW_VERZ_ZEIT:    !include { file: templates/wp_generic.yaml    , vars: { property: "EL_NACHERW_VERZ_ZEIT"   , update_interval: $interval_very_slow, unit: "min", icon: "mdi:timer-lock" }}
  DAEMPFUNG_AUSSENTEMP:    !include { file: templates/wp_generic.yaml    , vars: { property: "DAEMPFUNG_AUSSENTEMP"   , update_interval: $interval_very_slow, unit: "h", icon: "mdi:timer-sand" }}
  MAX_VORLAUFTEMP_HZ:      !include { file: templates/wp_temperature.yaml, vars: { property: "MAX_VORLAUFTEMP_HZ"     }}
  BIVALENZTEMPERATUR_HZG:  !include { file: templates/wp_temperature.yaml, vars: { property: "BIVALENZTEMPERATUR_HZG" }}
  KORREKTUR_AUSSENTEMP:    !include { file: templates/wp_temperature.yaml, vars: { property: "KORREKTUR_AUSSENTEMP"   }}
  TEMP_AUSLEGUNG_HEIZEN:   !include { file: templates/wp_temperature.yaml, vars: { property: "TEMP_AUSLEGUNG_HEIZEN"  }}
  SOMMERBETRIEB_HYSTERESE: !include { file: templates/wp_temperature.yaml, vars: { property: "SOMMERBETRIEB_HYSTERESE", unit: "°K" }}
  RAUMSOLLTEMP_BEREITSCHAFT: !include { file: templates/wp_temperature.yaml, vars: { property: "RAUMSOLLTEMP_BEREITSCHAFT", target: "HK1" }}
  HEIZKREISSOLL_HAND:      !include { file: templates/wp_temperature.yaml, vars: { property: "HEIZKREISSOLL_HAND"     , target: "HK1" }}
  MAX_VORLAUFTEMP_WW:      !include { file: templates/wp_temperature.yaml, vars: { property: "MAX_VORLAUFTEMP_WW"     }}
  MAX_DAUER_WW_ERZEUGUNG:  !include { file: templates/wp_generic.yaml    , vars: { property: "MAX_DAUER_WW_ERZEUGUNG" , update_interval: $interval_very_slow, unit: "h", icon: "mdi:timer-sand" }}
  WW_PUFFERBETRIEB:        !include { file: templates/wp_generic.yaml    , vars: { property: "WW_PUFFERBETRIEB"       , update_interval: $interval_very_slow, icon: "mdi:water-boiler" }}
  ANTILEGIONELLEN_ZEIT:    !include { file: templates/wp_generic.yaml    , vars: { property: "ANTILEGIONELLEN_ZEIT"   , update_interval: $interval_very_slow, unit: "h", scaler: "0.25", accuracy_decimals: "2", icon: "mdi:clock-outline" }}
